# Publish to npm on a version tag, using npm Trusted Publishing (OIDC).
#
# No token lives in this repo, in CI secrets, or on anyone's laptop:
# GitHub mints a short-lived identity token for this exact workflow, and
# npm verifies it against the trusted publisher configured on the package.
# The published tarball also gets a provenance attestation for free.
#
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   Publisher: GitHub Actions
#   Organization / repository: N-45div / foolscap
#   Workflow filename: release.yml
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: lets GitHub mint the OIDC token for npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs a recent npm; the bundled one may be older.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm build

      # Refuse to publish a tag that disagrees with package.json.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - run: npm publish

  # The Linux bundle: the published package plus its runtime dependencies,
  # so install.sh needs no npm. Attached to a GitHub Release with a
  # checksum; the release page's download counts are public.
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the bundle
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $VERSION"; exit 1; }
          npm pack --pack-destination /tmp
          mkdir -p /tmp/bundle
          tar -xzf "/tmp/foolscap-$VERSION.tgz" -C /tmp/bundle --strip-components=1
          (cd /tmp/bundle && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          mkdir -p /tmp/out
          tar -czf "/tmp/out/foolscap-$VERSION-linux.tar.gz" -C /tmp/bundle .
          cp "/tmp/out/foolscap-$VERSION-linux.tar.gz" /tmp/out/foolscap-linux.tar.gz
          (cd /tmp/out && sha256sum "foolscap-$VERSION-linux.tar.gz" > "foolscap-$VERSION-linux.tar.gz.sha256" && sha256sum foolscap-linux.tar.gz > foolscap-linux.tar.gz.sha256)
          ls -la /tmp/out
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/out/*
          generate_release_notes: true
